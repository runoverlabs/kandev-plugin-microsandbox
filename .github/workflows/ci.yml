name: CI

# Actions are pinned by commit SHA with the tag in a trailing comment: a tag can
# be moved, a SHA cannot, and this is third-party code with access to the build.
# The runner is pinned too, so a runner change is a commit that CI votes on.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The Kandev SDK the plugin is built against: a tag, never HEAD. It is also the
# manifest's min_kandev_version, so there is no separate minimum leg yet. Keep
# it in step across the workflows in this directory (docs/development.md).
env:
  KANDEV_REF: v0.97.0

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kandev-plugin-microsandbox

      # The SDK is not a standalone module yet, so the build needs a sibling
      # kandev checkout (see docs/development.md).
      - name: Check out kandev SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kdlbs/kandev
          ref: ${{ env.KANDEV_REF }}
          path: kandev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # An exact patch release: stdlib fixes (crypto, net) ship in patch
          # releases. Keep every pin in step; bump it when govulncheck reports
          # a newer fix.
          go-version: "1.26.9"
          cache-dependency-path: kandev-plugin-microsandbox/go.sum

      # The settings pages: a TypeScript bundle, built here rather than
      # committed so the package never carries a stale one.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install UI dependencies
        working-directory: kandev-plugin-microsandbox
        run: npm ci --no-audit --no-fund

      - name: Check module files are tidy
        working-directory: kandev-plugin-microsandbox
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: gofmt, go vet, manifest
        working-directory: kandev-plugin-microsandbox
        run: make lint

      - name: Go tests (race)
        working-directory: kandev-plugin-microsandbox
        run: make test-race

      - name: UI typecheck, bundle and tests
        working-directory: kandev-plugin-microsandbox
        run: make test-ui

      - name: Verify package
        working-directory: kandev-plugin-microsandbox
        run: make verify-package
