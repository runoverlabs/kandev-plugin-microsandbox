# Kandev plugin manifest: the declarative contract between this plugin and a
# Kandev host. `id` matches the Go module name and the release asset name;
# keep them in sync when renaming. `make validate-manifest` checks this file
# with the pinned Kandev's own validator.
id: "kandev-plugin-microsandbox"
api_version: 2
version: "0.1.0-dev.12"
display_name: "microsandbox"
description: "Run each Kandev session in its own microsandbox microVM on registered sandbox hosts."
author: "naerymdan"
repo_url: "https://github.com/runoverlabs/kandev-plugin-microsandbox"
categories: ["tools"]
icon: "assets/icon.svg"

# Remote executor plugins are on by default from v0.97.0, and this is the
# release the provider contract here was read from.
min_kandev_version: "0.97.0"

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# state: the sandbox host registry and the root certificate. secrets: the
# plugin's SSH private key and the root's private key.
# Changing this set invalidates the operator's approval for every capability;
# internal/plugin/manifest_test.go pins it.
# The settings pages: an overview on the plugin's own page, then Sandbox
# hosts, Egress and Secrets, all calling the admin actions below.
ui:
  bundle: "/ui/bundle.js"
  styles: ["/ui/plugin.css"]

capabilities:
  executor_provider: true
  state: true
  secrets: true

# The Sandbox Hosts and root certificate actions. Every one is admin-only:
# the registry decides where every workspace's sandboxes run, hosts.scan
# dials out, and the root is what the Kandev server trusts. `scope` is
# required by the action contract; the registry itself is plugin-wide.
actions:
  - key: "hosts.list"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "hosts.scan"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "hosts.add"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 16384
  - key: "hosts.update"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 16384
  - key: "hosts.drain"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "hosts.remove"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "hosts.setup"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 32768
  - key: "hosts.upgrade"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "hosts.setup.status"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "hosts.test"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  # The plugin's root certificate: the Kandev server trusts it for sandbox
  # hosts only (it is name-constrained), and hosts' certificates come from it.
  - key: "ca.get"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "ca.create"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 4096
  - key: "secrets.list"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "secrets.put"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 24576
  - key: "secrets.remove"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "setup.status"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "egress.list"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "egress.put"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 40960
  - key: "egress.remove"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "egress.defaults"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 4096

executor_providers:
  - key: "microsandbox"
    display_name: "microsandbox microVM"
    description: "An isolated microVM per session, on a registered sandbox host."
    contract_version: 1
    supported_state_versions: [1]
    # Kandev delivers every value as a string. Defaults and cross-field rules
    # (paired fields, reserved names) are enforced in internal/profile, since
    # this schema subset has no `default` keyword.
    profile_schema:
      type: object
      required: [placement, image, cpus, memory_mib, max_lifetime_hours]
      properties:
        placement:
          type: string
          title: "Placement"
          description: "label:<label> to use any host carrying that label, or host:<name> for one host."
        image:
          type: string
          title: "OCI image"
          description: "Pinned by digest, e.g. ghcr.io/acme/api-sbx@sha256:... A tag alone is refused."
        cpus:
          type: integer
          title: "CPUs"
          minimum: 1
          maximum: 16
        memory_mib:
          type: integer
          title: "Memory (MiB)"
          minimum: 512
          maximum: 65536
        disk_gib:
          type: integer
          title: "Root disk (GiB)"
          description: "Default 20."
          minimum: 5
          maximum: 500
        workspace_gib:
          type: integer
          title: "Workspace disk (GiB)"
          description: "A disk of its own, mounted at /workspace and removed with the sandbox. Default 20."
          minimum: 1
          maximum: 500
        max_lifetime_hours:
          type: integer
          title: "Maximum lifetime (hours)"
          description: "Hard cap: the sandbox is destroyed at this age even if Kandev never asks."
          minimum: 1
          maximum: 168
        retain_hours:
          type: integer
          title: "Retain after stop (hours)"
          description: "How long a stopped sandbox is kept for review. Default 24."
          minimum: 0
          maximum: 168
        egress_allow:
          type: string
          title: "Extra egress"
          description: "Comma-separated entries this profile adds: host (HTTPS), *.suffix (HTTPS), host:port, address or address:port, such as 192.168.2.6:8788. On ports other than 443 a hostname is enforced as its resolved addresses; plain HTTP on :80 is always denied."
        egress_groups:
          type: string
          title: "Egress groups"
          description: "Comma-separated egress groups this profile adds to the plugin's default groups, such as openrouter or a group of your own. Managed with the egress actions."
        env:
          type: string
          title: "Environment"
          description: "KEY=VALUE;KEY2=VALUE2. Non-secret values only: use an extra secret for credentials."
        registry_username:
          type: string
          title: "Registry username"
          description: "For a private image."
        registry_password:
          type: string
          title: "Registry password"
          secret: true
        secrets:
          type: string
          title: "Secrets"
          description: "Comma-separated names of secrets kept by the plugin (its Secrets page), such as NPM_TOKEN. The guest sees each as a variable holding a placeholder; the sandbox host substitutes the value into request headers bound for that secret's hosts only."
    # Only what routes later calls: the host that owns the sandbox, its
    # name there and the environment id. Never a secret, a nonce or a lease.
    resource_state_schema:
      type: object
      additionalProperties: false
      required: [host, sandbox_name, env]
      properties:
        host:
          type: string
        sandbox_name:
          type: string
        # The Kandev environment id: how every msbctl kandev verb addresses
        # the sandbox on its host.
        env:
          type: string
        image:
          type: string
        created_at:
          type: string
    capabilities:
      terminal: true
      files: true
      git: true
      embedded_editor: true
      preview: true
      reattach: true
      retention: bounded
      maximum_lifetime_seconds: 604800
